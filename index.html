<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국내사업부 주요거점 폭염 현황</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --hd:#FFFFCC;          /* 표 헤더 연노랑 (원본 FFFFCC) */
  --bd:#000;             /* 표 테두리 */
  --red:#C00000;         /* 폭염특보 적색 (원본) */
  --navy:#1f3864; --line:#d8dee8; --bg:#eef1f6; --mut:#6b7688; --txt:#1c2534;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--txt);font-size:13px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:5px;font-size:12.5px;padding:7px 13px}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);
  border-radius:5px;padding:7px 9px;width:100%;background:#fff}
select{cursor:pointer}

.crTop{font-size:11px;color:rgba(255,255,255,.62);white-space:nowrap;letter-spacing:.2px}

/* ═══════════ 상단바 ═══════════ */
.top{background:var(--navy);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-size:15px}
.top .me{font-size:12px;background:rgba(255,255,255,.16);padding:4px 11px;border-radius:20px}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.top button:hover{background:rgba(255,255,255,.28)}

.wrap{max-width:1300px;margin:0 auto;padding:14px 18px 50px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.p-hd.big-hd{padding:11px 15px;font-size:16px;font-weight:800;letter-spacing:-.3px}
/* 폭염현황 요약 — 크게 */
.nat{padding:12px 16px}
.nat .big{font-size:16px;line-height:1.95;font-weight:600}
.nat .big b{font-weight:800;font-size:16px}
.nat .big em{font-style:normal;font-weight:800;font-size:16px}
.nat .big .nm{font-size:16px;color:#55617a;font-weight:600}
.nat .big > div{padding:2px 0}
/* 새로고침 바 */
.refbar{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex-wrap:wrap}
.refbar .sp{flex:1}
#btnRef{background:#d32f2f;color:#fff;font-weight:700;font-size:14px;padding:11px 34px;
  min-width:260px;border-radius:7px;letter-spacing:-.2px;
  box-shadow:0 2px 7px rgba(211,47,47,.32)}
#btnRef:hover{background:#b71c1c}
#btnRef:disabled{background:#c98b8b;cursor:default;box-shadow:none}
#btnRef.loading::before{content:'';display:inline-block;width:11px;height:11px;margin-right:7px;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  vertical-align:-1px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.refbar .ref-t{font-size:12.5px;color:var(--navy);font-weight:700}
.refbar .ref-hint{font-size:11.5px;color:var(--mut)}
body.busy .panel,body.busy #sheet{opacity:.55;pointer-events:none;transition:opacity .15s}
#netBar{background:#fdf5e3;border:1px solid #e6cf9b;border-left:4px solid #b7791f;
  border-radius:7px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:#6d4c11;
  line-height:1.7;gap:9px;align-items:flex-start}
#netBar::before{content:'⚠';font-size:15px;flex:0 0 auto}
#netBar b{color:#8a5a08}
.p-hd{padding:7px 13px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;
  color:var(--navy);display:flex;align-items:center;gap:8px;background:#f7f9fc;border-radius:8px 8px 0 0}
.p-hd .sp{flex:1}
.p-hd .t{font-size:11px;font-weight:400;color:var(--mut)}
.p-hd button{padding:4px 10px;font-size:11.5px;background:#eef2f7;color:var(--navy);font-weight:700}
.p-hd button:hover{background:#dde5f0}

.nat{padding:9px 14px}
.nat .big{font-size:12.5px;line-height:1.85}
.nat .big b{color:var(--navy)}
.nat .big .nm{font-size:11.5px;color:var(--mut)}
.nat .big > div{padding:1px 0}
.wd.sat .d{color:#2563a8} .wd.sun .d{color:#c0392b}

/* 거점 현재 기상 스트립 */
/* 사용자 코드 입력 */
.code-box{display:flex;align-items:center;gap:6px}
.code-box input{width:132px;padding:6px 9px;font-size:12.5px;border-radius:5px;border:none}
.code-box button{background:rgba(255,255,255,.2);color:#fff;font-weight:700;padding:6px 13px}
.code-box button:hover{background:rgba(255,255,255,.34)}
.code-lb{font-size:12px;font-weight:700;padding:3px 10px;border-radius:11px;
  background:rgba(255,255,255,.16);color:#cdd9ea}
.code-lb.on{background:#1f9254;color:#fff}
.code-lb.ng{background:#c62828;color:#fff}

/* 거점 카드 — 가로 5개씩 2줄, 음영은 전 거점 동일(옅은 하늘색) */
.sites{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px}
.st{border:1px solid #bcd6ea;border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;background:#fff}
.st-hd{padding:10px 8px 9px;text-align:center;background:#e8f4fc}   /* 옅은 하늘색 통일 */
.st .n{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.st .i{font-size:25px;line-height:1.3}
.st .t{font-size:20px;font-weight:800;letter-spacing:-.5px;color:#17324f}
.st .f{font-size:12.5px;color:#4a5a72}
.st .f b{font-size:15px;color:#c62828;font-weight:800}
/* 폭염특보 — 글자 확대 */
.st .al{margin:7px auto 0;font-size:14px;font-weight:800;padding:3px 13px;border-radius:13px;
  display:inline-block;border:1px solid rgba(0,0,0,.14);letter-spacing:-.3px}
.st.a0 .al{background:#eef1f5;color:#55617a}
.st.a1 .al{background:#ffe38a;color:#7a5600}
.st.a2 .al{background:#f2820a;color:#fff;border-color:#d9730a}
.st.a3 .al{background:#8e1b10;color:#fff;border-color:#7d1710}
/* 입력 칸 — 글자 한 단계 크게 + bold */
.st .in{border-top:1px solid #dbe7f2;padding:7px 10px 8px;min-height:60px}
.st .in-lb{font-size:11px;font-weight:800;color:var(--mut);margin-bottom:3px}
.st .in-tx{font-size:13.5px;font-weight:700;line-height:1.5;white-space:pre-wrap;
  word-break:break-word;color:#1e2939}
.st .in-tx.empty{color:#a9b4c4;font-weight:500}
.st .in.edit{cursor:pointer;background:#fffdf3}
.st .in.edit:hover{background:#fff6d6;outline:2px solid #e8c85a;outline-offset:-2px}
.st .in.editing{background:#fff;outline:2px solid var(--navy);outline-offset:-2px}
.in-ed{width:100%;font-family:inherit;font-size:13.5px;font-weight:700;line-height:1.5;
  border:1px solid var(--line);border-radius:4px;padding:5px 7px;resize:vertical;
  min-height:52px;background:#fff;color:#1e2939}
.in-ed.tall{min-height:70px;font-size:14.5px}
.in-ed:focus{outline:2px solid #b9d3f0;outline-offset:-1px}
.in-tip{font-size:10px;color:var(--mut);margin-top:3px;line-height:1.4}
/* 기타사항 */
.etc-wrap{display:flex;border-top:1px solid var(--line)}
.etc-lb{flex:0 0 104px;padding:12px;font-size:13.5px;font-weight:800;color:var(--navy);
  background:#e8f4fc;border-right:1px solid #bcd6ea;display:flex;align-items:center}
.etc-box{flex:1;padding:12px 14px;font-size:14.5px;font-weight:700;line-height:1.65;
  white-space:pre-wrap;min-height:54px;color:#1e2939}
.etc-box .empty{color:#a9b4c4;font-weight:500}
.etc-box.edit{cursor:pointer;background:#fffdf3}
.etc-box.edit:hover{background:#fff6d6;outline:2px solid #e8c85a;outline-offset:-2px}
.etc-box.editing{background:#fff;outline:2px solid var(--navy);outline-offset:-2px}
/* 특보 출처 표기 */
.nat .big .src{font-size:13px;color:#55617a;font-weight:600;padding-top:4px}
.nat .big .src b{font-size:13px}
.nat .big .warn{color:#b7791f;font-weight:700}
.st .al .est{font-size:9.5px;font-weight:700;margin-left:4px;opacity:.75}

/* 일괄 입력·삭제 버튼 */
.bulk{display:flex;gap:6px;margin-left:14px}
.bulk button{font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;
  background:#e8eef8;color:var(--navy);border:1px solid #c3d2e8}
.bulk button:hover{background:#d8e3f4}
.bulk button.del{background:#fdecea;color:var(--red);border-color:#f0c9c4}
.bulk button.del:hover{background:#f9d9d5}

/* 범례 — 폭염특보 배지 색 설명 */
.legend{display:flex;align-items:center;gap:5px;font-size:13px;color:#44506a;font-weight:600}
.legend b{font-weight:800;color:var(--navy);margin-right:4px;font-size:13px}
.legend i{display:inline-block;width:17px;height:17px;border-radius:4px;
  border:1px solid rgba(0,0,0,.18);margin-left:9px;vertical-align:-3px}
.legend i.a0{background:#eef1f5} .legend i.a1{background:#ffe38a}
.legend i.a2{background:#f2820a} .legend i.a3{background:#8e1b10}
@media(max-width:1180px){ .sites{grid-template-columns:repeat(3,1fr)} }
@media(max-width:760px){ .sites{grid-template-columns:repeat(2,1fr)} }

/* 확정 이력 */
#histList table{width:100%;border-collapse:collapse;font-size:12.5px}
#histList th{background:#f2f5f9;padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--mut)}
#histList td{padding:7px 10px;border-bottom:1px solid #eef1f5}
#histList td.sm{font-size:11.5px;color:#55617a}
#histList button{padding:4px 11px;font-size:11.5px;background:#eef1f5;color:var(--txt)}
#histList .hist-none{padding:20px;text-align:center;color:var(--mut);font-size:12.5px}
#histList button.del{background:#fdecea;color:var(--red);font-weight:700;margin-left:4px}
#histList button.del:hover{background:#f9d9d5}
#histList .hist-note{padding:9px 11px;font-size:11.5px;color:var(--mut);border-top:1px solid #eef1f5}
/* 확정본 상세 */
#histDetail{border-top:2px solid var(--navy);background:#fbfcfe}
.hd-top{display:flex;align-items:center;gap:12px;padding:9px 13px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.hd-top b{font-size:14px;color:var(--navy)}
.hd-top .sp{flex:1}
.hd-top button{padding:5px 13px;font-size:11.5px;background:#eef1f5;color:var(--txt);font-weight:700}
.hd-scroll{overflow-x:auto;padding:0 4px 4px}
.hd-tbl{width:100%;min-width:820px;border-collapse:collapse;font-size:12px}
.hd-tbl th{background:#eef2f7;padding:6px 8px;border:1px solid #dbe3ee;font-size:11px;
  color:#44506a;white-space:nowrap}
.hd-tbl td{padding:6px 8px;border:1px solid #e4eaf2;vertical-align:top;
  white-space:pre-wrap;word-break:break-word}
.hd-tbl td.nm{font-weight:800;color:var(--navy);white-space:nowrap;background:#f7f9fc}
.hd-tbl td.al{font-weight:800;text-align:center;white-space:nowrap}
.hd-tbl td.al.a1{background:#ffe38a;color:#7a5600}
.hd-tbl td.al.a2{background:#f2820a;color:#fff}
.hd-tbl td.al.a3{background:#8e1b10;color:#fff}
.hd-tbl td.etc{background:#fff}
.hd-note{padding:7px 13px;font-size:11.5px;color:var(--mut)}
/* 하단 버튼 — 새로고침 버튼과 같은 크기·형태 */
.bar{gap:11px;align-items:center}
.bar #btnFix,.bar #btnCopy{font-weight:700;font-size:14px;padding:11px 34px;
  min-width:260px;border-radius:7px;letter-spacing:-.2px;color:#fff;border:none}
.bar #btnFix{background:#1f9254;box-shadow:0 2px 7px rgba(31,146,84,.30)}
.bar #btnFix:hover{background:#17703f}
.bar #btnCopy{background:#2f5597;box-shadow:0 2px 7px rgba(47,85,151,.30)}
.bar #btnCopy:hover{background:#1f3864}
.bar #btnFix:disabled,.bar #btnCopy:disabled{background:#9aa7bb;box-shadow:none;cursor:default}
.bar #btnFix.done,.bar #btnCopy.done{background:#e8f6ee;color:#1f9254;box-shadow:none}
.bar .fix-t{font-size:12.5px;color:var(--navy);font-weight:700}
/* 확정 이력 접이식 */
.p-hd.acc{cursor:pointer;user-select:none}
.p-hd.acc:hover{background:#eef2f7}
.acc-ar{font-size:10px;color:var(--mut);transition:transform .15s;display:inline-block}
.acc-ar.on{transform:rotate(90deg)}

@media print{ .top,.bar,.tip,  body{background:#fff} .wrap{padding:0} }
</style>
</head>
<body>

<!-- ══════ 로그인 ══════ -->
<!-- ══════ 상단바 ══════ -->
<div class="top" id="topbar">
  <b>국내사업부 주요거점 폭염 현황</b>
  <span id="buildTag" style="font-size:11px;opacity:.55;margin-left:6px"></span>
  <span id="dbTag" style="font-size:11.5px"></span>
  <span class="sp"></span>
  <span class="code-box">
    <span class="code-lb" id="codeState">조회 전용</span>
    <input id="codeIn" type="password" placeholder="사용자 코드" autocomplete="off"
           onkeydown="if(event.key==='Enter')applyCode()">
    <button onclick="applyCode()" id="codeBtn">확인</button>
    <button onclick="lockCode()" id="codeOff" style="display:none">잠금</button>
  </span>
  <span class="crTop">©2026 김원상 All rights reserved.</span>
</div>

<div class="wrap" id="app">

  <!-- 새로고침 (전체 공통) -->
  <div class="refbar">
    <button id="btnRef" onclick="refreshNow()">↻ 새로고침</button>
    <span class="ref-t" id="refTime"></span>
    <span class="sp"></span>
    <span class="ref-hint">기상현황 · 체감온도 · 폭염특보와 기준시각을 현재 시점으로 갱신합니다</span>
  </div>

  <div id="netBar" style="display:none"></div>

  <!-- 복사 대상 : 폭염현황 + 거점별 현재 기상 -->
  <div id="capture">
    <div class="panel">
      <div class="p-hd big-hd"><span id="sumTitle">폭염현황</span></div>
      <div class="nat"><div class="big" id="natSummary">—</div></div>
    </div>

    <div class="panel">
      <div class="p-hd big-hd"><span>거점별 현재 기상 · 체감온도</span>
        <span class="bulk no-copy" id="bulkBtns" style="display:none">
          <button onclick="bulkFill()">전체입력 (특이사항 없음)</button>
          <button class="del" onclick="bulkClear()">전체삭제</button>
        </span>
        <span class="sp"></span>
        <span class="legend">
          <b>폭염특보</b>
          <i class="a0"></i>없음
          <i class="a1"></i>주의보
          <i class="a2"></i>경보
          <i class="a3"></i>중대경보
        </span></div>
      <div class="sites" id="siteStrip"></div>
      <div class="etc-wrap">
        <div class="etc-lb">기타사항</div>
        <div class="etc-box" id="etcBox">—</div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button id="btnFix" onclick="confirmBoard()">✔ 폭염현황 확정</button>
    <button id="btnCopy" onclick="copyImg()">📋 복사</button>
    <span class="sp"></span>
    <span class="fix-t" id="fixTime"></span>
  </div>
  <div class="tip" id="tip"></div>

  <!-- 확정 이력 (접이식) -->
  <div class="panel" id="histPanel">
    <div class="p-hd acc" onclick="toggleHist()">
      <span class="acc-ar" id="histAr">▶</span>
      <span>확정 이력</span><span class="t" id="histCnt"></span>
      <span class="sp"></span>
      <button onclick="event.stopPropagation();loadHist()">↻ 새로 읽기</button></div>
    <div id="histWrap" style="display:none">
      <div id="histList"></div>
      <div id="histDetail" style="display:none"></div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   1. 마스터 데이터
   ════════════════════════════════════════════════════════════ */
// 표 컬럼 순서 (원본 엑셀과 동일)
//  nx,ny  : 기상청 단기예보 격자좌표
//  stn    : 기상특보 발표관서 코드 (109 서울·경기 / 133 대전·충남 / 146 전북 / 159 부산·경남)
//  area   : 특보 통보문에 쓰이는 시·군명 (폭염특보 자동 매칭용)
//  wide   : 시·군이 안 잡힐 때 쓰는 광역 키워드
//  addr  : 사업장 주소 (격자좌표 산출 근거)
//  nx,ny : 기상청 동네예보 격자좌표 — 위 주소를 지오코딩해 LCC 변환한 값
//  stn   : 기상특보 발표관서 / area : 특보문 시·군명 / wide : 광역명
const SITES=[
 {id:'gunsan',   name:'군산',     addr:'군산항 5부두 · 전북 군산시 소룡동 (서해로 194)',
  lat:35.97530, lon:126.59046, nx:53, ny:92,  stn:146, area:['군산'], wide:['전북','전라북도','전북특별자치도'],
  regLand:'11F10000', regTa:'11F10501'},
 {id:'janghang', name:'장항',     addr:'한솔제지 장항공장 · 충남 서천군 장항읍',
  lat:36.01051, lon:126.67883, nx:55, ny:93,  stn:133, area:['서천'], wide:['충남','충청남도'],
  regLand:'11C20000', regTa:'11C20201'},
 {id:'daejeon',  name:'대전',     addr:'한솔제지 대전공장 · 대전 대덕구 신일동',
  lat:36.43465, lon:127.40118, nx:68, ny:102, stn:133, area:['대전'], wide:['대전'],
  regLand:'11C20000', regTa:'11C20401'},
 {id:'cheonan',  name:'천안',     addr:'한솔제지 천안공장 · 충남 천안시 동남구 광덕면',
  lat:36.68945, lon:127.16029, nx:63, ny:108, stn:133, area:['천안'], wide:['충남','충청남도'],
  regLand:'11C20000', regTa:'11C20101'},
 {id:'sintanjin',name:'신탄진',   addr:'한솔제지 신탄진공장 · 대전 대덕구 신일동',
  lat:36.43321, lon:127.40752, nx:68, ny:102, stn:133, area:['대전'], wide:['대전'],
  regLand:'11C20000', regTa:'11C20401'},
 {id:'busanNP',  name:'부산신항', addr:'부산신항국제터미널 · 부산 강서구 성북동 (신항남로 330)',
  lat:35.08181, lon:128.83380, nx:94, ny:73,  stn:159, area:['부산'], wide:['부산'],
  regLand:'11H20000', regTa:'11H20201'},
 {id:'stjCY',    name:'신탄진 CY',addr:'한솔CSN 신탄진CY · 대전 대덕구 평촌동',

// 기상청 여름철 체감온도 (습구온도 Stull 근사식 기반)
function feelsSummer(ta,rh){
  const tw = ta*Math.atan(0.151977*Math.pow(rh+8.313659,0.5))
           + Math.atan(ta+rh) - Math.atan(rh-1.676331)
           + 0.00391838*Math.pow(rh,1.5)*Math.atan(0.023101*rh) - 4.686035;
  return -0.2442 + 0.55399*tw + 0.45535*ta - 0.0022*tw*tw + 0.00278*tw*ta + 3.0;
}
// 겨울철 체감온도 (풍속 냉각지수)
function feelsWinter(ta,wsd){
  const v=Math.pow(wsd*3.6,0.16);
  if(wsd*3.6<4.8) return ta;
  return 13.12 + 0.6215*ta - 11.37*v + 0.3965*ta*v;
}
function feels(ta,rh,wsd){
  const m=new Date().getMonth()+1;
  const f=(m>=5&&m<=9)?feelsSummer(ta,rh):feelsWinter(ta,wsd);
  return Math.round(f*10)/10;
}

const PTYT={0:'',1:'비',2:'비/눈',3:'눈',5:'빗방울',6:'진눈깨비',7:'눈날림'};
function skyText(sky,pty){ return (pty&&PTYT[pty]) ? PTYT[pty] : (SKYT[sky]||'맑음'); }
function skyIcon(sky,pty){
  if(pty) return ({1:'🌧',2:'🌨',3:'❄️',5:'🌦',6:'🌨',7:'🌨'})[pty]||'🌧';
  return sky===4?'☁️':sky===3?'⛅':'☀️';
}

const pad=n=>String(n).padStart(2,'0');
/* 모든 날짜·시각 판단은 한국시간(KST) 기준으로 한다.
   PC 시간대가 달라도 자정 자동저장과 기상청 조회 시각이 어긋나지 않게. */
function kstNow(){
  const d=new Date();
  return new Date(d.getTime() + (d.getTimezoneOffset() + 9*60) * 60000);
}
const ymd=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const DOW=['일','월','화','수','목','금','토'];

const KMA={
  /* 매 호출마다 _t 를 붙여 중간 캐시(CDN·브라우저)를 확실히 통과시킨다.
     이게 없으면 새로고침을 눌러도 5분 전 응답이 그대로 돌아온다. */
  url(p,q){
    const bust={_t:Date.now()};
    if(CFG.proxy) return `${CFG.proxy}?path=${encodeURIComponent(p)}&`
                        + new URLSearchParams({dataType:'JSON',...q,...bust});
    return `https://apis.data.go.kr/1360000/${p}?`
         + new URLSearchParams({serviceKey:CFG.key,dataType:'JSON',...q,...bust});
  },
  get(u){ return fetch(u,{cache:'no-store'}) },
  /* 초단기실황 — 정시 관측이 약 40분 뒤 공개된다.
     한 번 성공한 기준시각을 기억해 나머지 거점은 1회 호출로 끝낸다. */
  _ncstAt:null,
  async _ncstTry(nx,ny,d){
    const r=await this.get(this.url('VilageFcstInfoService_2.0/getUltraSrtNcst',
      {pageNo:1,numOfRows:20,base_date:ymd(d),base_time:pad(d.getHours())+'00',nx,ny}));
    const j=await r.json(), it=j?.response?.body?.items?.item;
    if(!it||!it.length) return null;
    const o={}; it.forEach(x=>o[x.category]=parseFloat(x.obsrValue));
    o._at=`${pad(d.getHours())}:00`;              // 실제 관측시각
    return o;
  },
  async ncst(nx,ny,at){
    if(!at && this._ncstAt){                             // 이미 확정된 기준시각 사용
      const o=await this._ncstTry(nx,ny,this._ncstAt);
      if(o) return o;
    }
    const base=at?new Date(at):new Date(kstNow().getTime()-40*60000);
    let last='';
    for(let back=0;back<4;back++){
      const d=new Date(base.getTime()-back*3600e3);
      try{
        const o=await this._ncstTry(nx,ny,d);
        if(o){ if(!at) this._ncstAt=d; return o }
        last='자료 없음';
      }catch(e){ last=e.message }

    throw new Error(last||'실황 오류');
  },
  async vilage(nx,ny){                                   // 단기예보 3일
    const d=new Date(); const hs=[23,20,17,14,11,8,5,2];
    let h=hs.find(x=>d.getHours()>=x+1)??23;
    if(h===23&&d.getHours()<3) d.setDate(d.getDate()-1);
    const r=await fetch(this.url('VilageFcstInfoService_2.0/getVilageFcst',
      {pageNo:1,numOfRows:1000,base_date:ymd(d),base_time:pad(h)+'00',nx,ny}));
    const j=await r.json(); return j?.response?.body?.items?.item||[];
  },
  async sky(nx,ny){                                      // 초단기예보 SKY
    const d=new Date(kstNow().getTime()-50*60000);
    const r=await this.get(this.url('VilageFcstInfoService_2.0/getUltraSrtFcst',
      {pageNo:1,numOfRows:30,base_date:ymd(d),base_time:pad(d.getHours())+'30',nx,ny}));
    const j=await r.json(), it=j?.response?.body?.items?.item||[];
    const v=it.find(x=>x.category==='SKY'); return v?+v.fcstValue:1;
  },
  /* 기상특보 통보문 — t6 에 발효 현황이 구역까지 들어 있다.
     ※ 주의 : tmFc(발표시각)와 t5(발효시각)가 다르다.
        "07/29 16시 발표 / 07/30 11시 발효" 처럼 미래에 적용될 통보문이 섞여 있어서
        발표시각만 보고 최신 것을 고르면 아직 오지 않은 특보를 현재 상태로 표시하게 된다.
        → t5(발효시각)가 이미 지난 것들 중에서 가장 나중에 발효된 것을 채택한다. */
  async warnMsg(stn){
    const t=kstNow(), f=new Date(kstNow().getTime()-72*3600e3);
    const r=await this.get(this.url('WthrWrnInfoService/getWthrWrnMsg',
      {pageNo:1,numOfRows:20,stnId:stn,fromTmFc:ymd(f),toTmFc:ymd(t)}));
    const j=await r.json();
    const items=j?.response?.body?.items?.item||[];
    if(!items.length) return null;
    const now=+(`${ymd(t)}${pad(t.getHours())}${pad(t.getMinutes())}`);   // KST
    const eff=(i)=>+(i.t5||i.tmFc||0);
    const live=items.filter(i=>eff(i)<=now);
    const future=items.filter(i=>eff(i)>now).sort((a,b)=>eff(a)-eff(b))[0]||null;
    if(!live.length) return {cur:null, next:future};
    return { cur: live.reduce((a,b)=>(eff(b)>eff(a)?b:a)), next:future };
  }
};

/* ── 특보 통보문 t6 파싱 ───────────────────────────────────────
   o 폭염경보 : 충청남도(부여, 청양, 태안), 대전, 세종(세종남부)
   o 폭염주의보 : 충청남도(부여, 청양, 태안 제외), 세종(세종북부)
   ※ '제외' 가 붙으면 나열된 시·군을 뺀 나머지 전체가 대상이다.   */
function splitTop(s){                                       // 괄호 밖 쉼표로만 분리
  const out=[]; let d=0, cur='';
  for(const ch of s){
    if(ch==='('||ch==='（') d++;
    else if(ch===')'||ch==='）') d--;
    if(ch===',' && d===0){ out.push(cur); cur=''; } else cur+=ch;
  }
  out.push(cur);
  return out.map(x=>x.trim()).filter(Boolean);
}
/* 구역명 대조는 '정확히 일치'로 한다.
   부분일치로 하면 '부산동부'가 '부산'을 품어 (부산동부 제외) 판정이 뒤집히고,
   '군산옥도면'(섬)이 '군산'으로 잘못 잡힌다.
   단, '군산(옥도면 제외)' 처럼 괄호가 달린 이름은 괄호를 떼고 비교한다. */
function nameEq(n,k){
  const base=String(n).replace(/[(（].*$/,'').trim();
  return base===k || String(n).trim()===k;
}
function segHit(site, seg){
  const m=seg.match(/^(.+?)\s*[(（](.+)[)）]\s*$/);
  if(!m) return site.wide.some(k=>seg.includes(k)) || site.area.some(k=>seg.includes(k));
  const wide=m[1].trim(), inner=m[2].trim();
  if(!site.wide.some(k=>wide.includes(k)) && !site.area.some(k=>wide.includes(k))) return false;
  const excl=/제외\s*$/.test(inner);                        // 끝에 '제외' → 나열분을 뺀 나머지 전체
  const names=splitTop(inner.replace(/\s*제외\s*$/,''));
  const listed=names.some(n=>site.area.some(k=>nameEq(n,k)));
  return excl ? !listed : listed;
}
function parseHeatT6(t6){
  const out={}; WX_SITES.forEach(s=>out[s.id]='없음');
  if(!t6) return out;
  t6.split(/\r?\n/).forEach(L=>{
    const m=L.match(/폭염(중대경보|경보|주의보)\s*[:：]\s*(.+)$/);
    if(!m) return;
    const lv=m[1], segs=splitTop(m[2]);
    WX_SITES.forEach(s=>{
      if(ALERT_LV.indexOf(lv) <= ALERT_LV.indexOf(out[s.id])) return;   // 상위 등급 유지
      if(segs.some(seg=>segHit(s,seg))) out[s.id]=lv;
    });
  });
  return out;
}

async function collect(){
  const at=kstNow();
  NETFAIL=null; KMA._ncstAt=null;
  if(CFG.mode!=='live'||!CFG.key){ fillDemo(at); return {ok:0,fail:0,demo:true} }
  let ok=0,fail=0, lastErr='';

  // ① 같은 격자를 쓰는 거점은 한 번만 조회한다 (호출 수 최소화)
  const grids={};
  WX_SITES.forEach(s=>{ const k=s.nx+','+s.ny; (grids[k]=grids[k]||[]).push(s) });
  const keys=Object.keys(grids);
  const g0=grids[keys[0]][0];
  try{ await KMA.ncst(g0.nx,g0.ny) }catch(e){}      // 실황 기준시각 먼저 확정

  await Promise.all(keys.map(async k=>{
    const [nx,ny]=k.split(',').map(Number);
    const mine=grids[k];
    try{
      const [n,sk]=await Promise.all([KMA.ncst(nx,ny), KMA.sky(nx,ny).catch(()=>1)]);
      const f=feels(n.T1H,n.REH,n.WSD);
      if(n._at) LIVE.obsAt=n._at;                 // 실제 관측시각 (매시 정시)
      mine.forEach(s=>{ LIVE.sites[s.id]={sky:sk, pty:n.PTY||0, ta:n.T1H, rh:n.REH,
                                          wsd:n.WSD, feels:f, alert:heatAlert(f)} });
      ok+=mine.length;
    }catch(e){ fail+=mine.length; lastErr=e.message; console.warn(k,e.message) }
  }));
  if(ok===0){                                       // 전부 실패 → 데모로 전환
    NETFAIL = /SERVICE|KEY|등록되지|LIMITED/i.test(lastErr) ? 'key'
            : (CFG.proxy ? 'proxy' : 'cors');
    NETFAIL_MSG = lastErr;
    fillDemo(at);
    return {ok:0,fail,demo:true};
  }

  // ③ 폭염특보 — 거점이 속한 발표관서의 통보문을 매번 다시 읽어 갱신한다.
  //    통보문을 받았으면 그 값이 정답이다('없음' 포함). 못 받은 관서만 체감온도 추정을 남긴다.
  LIVE.pending=[]; LIVE.alertOk=0; LIVE.alertNg=0; LIVE.alertAt='';
  try{
    const stns=[...new Set(WX_SITES.map(s=>s.stn))];
    const res=await Promise.all(stns.map(st=>KMA.warnMsg(st).catch(()=>null)));
    stns.forEach((st,i)=>{
      const r=res[i];
      const mine=WX_SITES.filter(s=>s.stn===st);
      if(!r || !r.cur){                                   // 통보문 미수신 → 추정값 유지
        mine.forEach(s=>{ if(LIVE.sites[s.id]) LIVE.sites[s.id].alertSrc='est' });
        LIVE.alertNg+=mine.length;
        return;
      }
      const m=parseHeatT6(r.cur.t6);
      const at=String(r.cur.t5||r.cur.tmFc||'');
      if(at>LIVE.alertAt) LIVE.alertAt=at;
      mine.forEach(s=>{ if(LIVE.sites[s.id]){
        LIVE.sites[s.id].alert=m[s.id];                   // 발효 중인 값으로 교체
        LIVE.sites[s.id].alertSrc='kma';
        LIVE.sites[s.id].alertAt=at;
      }});
      LIVE.alertOk+=mine.length;
      if(r.next){                                         // 발효 예정 안내
        const nm=parseHeatT6(r.next.t6);
        mine.forEach(s=>{
          const cur=LIVE.sites[s.id]?.alert||'없음';
          if(nm[s.id]!==cur) LIVE.pending.push({name:s.name, from:cur, to:nm[s.id], at:String(r.next.t5)});
        });
      }
    });
  }catch(e){ console.warn('폭염특보 조회 실패', e.message); LIVE.alertNg=WX_SITES.length }

  LIVE.at=at; return {ok,fail};
}


/* ════════════════════════════════════════════════════════════
   5. 일자별 스냅샷 (매일 14시 기준 자동 확정)
   ════════════════════════════════════════════════════════════ */
function blankDay(dstr){
  const o={date:dstr, baseAt:null, locked:false, wx:{}, notes:{}, etc:{text:'',by:'',at:''}};
  SITES.forEach(s=>{o.notes[s.id]={worker:'',facility:'',transport:'',by:'',at:''}});
  return o;
}

/* 저장된 자료의 빠진 항목을 채워 넣는다.
   (이전 버전에서 저장된 자료나 일부만 기록된 자료 때문에 화면이 깨지는 것을 막음) */
function normalizeDay(d, dstr){
  if(!d || typeof d!=='object') return blankDay(dstr);
  d.date = d.date || dstr;
  if(typeof d.locked!=='boolean') d.locked=false;
  if(!d.wx    || typeof d.wx!=='object')    d.wx={};
  if(!d.notes || typeof d.notes!=='object') d.notes={};
  if(!d.etc   || typeof d.etc!=='object')   d.etc={text:'',by:'',at:''};
  if(typeof d.etc.text!=='string') d.etc.text='';
  SITES.forEach(s=>{
    const n=d.notes[s.id];
    if(!n || typeof n!=='object') d.notes[s.id]={worker:'',facility:'',transport:'',by:'',at:''};
    else ['worker','facility','transport'].forEach(k=>{ if(typeof n[k]!=='string') n[k]='' });
    if(!(s.id in d.wx)) d.wx[s.id]=null;
  });
  return d;
}
/* 화면에서 그날 자료를 가져올 때는 항상 이걸 통해서 */
function day(k){ return DB[k]=normalizeDay(DB[k], k) }

/* ════════════════════════════════════════════════════════════
   5-2. 공용 저장소 동기화
   ════════════════════════════════════════════════════════════ */
let DBOK=null, SYNCING=false;      // null=확인전 / true=연결됨 / false=끊김
let DBPERM=[];                     // 권한(401)으로 막힌 경로 목록

function dbErr(status, path){
  const e=new Error(status===401?'권한 없음 (보안규칙)':'DB '+status);
  e.status=status; e.path=path;
  if(status===401 && !DBPERM.includes(path)) DBPERM.push(path);
  return e;
}
async function fbGet(path){
  const [p,q]=String(path).split('?');            // .json 은 쿼리 앞에 와야 한다
  const r=await fetch(`${FB}${p}.json${q?'?'+q:''}`, {cache:'no-store'});
  if(!r.ok) throw dbErr(r.status, p);
  return r.json();
}
async function fbSend(path, body, method){
  const r=await fetch(`${FB}${path}.json`, {method, body:JSON.stringify(body)});
  if(!r.ok) throw dbErr(r.status, path);
  return r.json();
}
/* 보안규칙 안내문 — 권한오류가 났을 때 그대로 붙여넣을 수 있게 */
const FB_RULES=`{
  "rules": {
    "days":  { ".read": true, ".write": true },
    "logs":  { ".read": true, ".write": true },
    "users": { ".read": true, ".write": true },
    "sites": { ".read": true, ".write": true }
  }
}`;
function permHelp(){
  return '공용 저장소 보안규칙에서 막혀 있습니다.\n\n'
    + 'Firebase 콘솔 → Realtime Database → 규칙 에 아래를 붙여넣고 [게시]하세요.\n\n'
    + FB_RULES + '\n\n막힌 경로 : ' + DBPERM.join(', ');
}
const fbPatch=(p,b)=>fbSend(p,b,'PATCH');
const fbPush =(p,b)=>fbSend(p,b,'POST');

/* 서버 → 화면 : 해당 일자를 내려받아 병합 */
async function pullDay(dstr){
  try{
    const rec=await fbGet(`/days/${dstr}`);
    DBOK=true;
    if(!rec) return false;
    const d=day(dstr);
    if(rec.wx)    SITES.forEach(s=>{ if(rec.wx[s.id]) d.wx[s.id]=rec.wx[s.id] });
    if(rec.notes) SITES.forEach(s=>{ if(rec.notes[s.id]) Object.assign(d.notes[s.id], rec.notes[s.id]) });
    if(rec.etc)   Object.assign(d.etc, rec.etc);
    if(rec.baseAt) d.baseAt=rec.baseAt;
    if(rec.locked) d.locked=true;
    save();
    return true;
  }catch(e){ if(e.status!==401) DBOK=false; console.warn('DB 읽기 실패', e.message); return false }
}
/* 화면 → 서버 : 바뀐 부분만 올림 */
async function pushNote(dstr, siteId, obj){
  try{ await fbPatch(`/days/${dstr}/notes/${siteId}`, obj); DBOK=true }
  catch(e){ DBOK=false; console.warn('DB 저장 실패', e.message) }
}
async function pushEtc(dstr, obj){
  try{ await fbPatch(`/days/${dstr}/etc`, obj); DBOK=true }
  catch(e){ DBOK=false; console.warn('DB 저장 실패', e.message) }
}
async function pushWx(dstr, d){
  try{ await fbPatch(`/days/${dstr}`, {wx:d.wx, baseAt:d.baseAt, locked:d.locked}); DBOK=true }
  catch(e){ DBOK=false }
}
async function pushLog(entry){
  try{ await fbPush('/logs', entry) }catch(e){}
}
/* 저장 가능한 일자 목록 */
async function pullDates(){
  try{ const o=await fbGet('/days?shallow=true'); DBOK=true;
       Object.keys(o||{}).forEach(k=>{ if(!DB[k]) DB[k]=blankDay(k) }); save(); }
  catch(e){ if(e.status!==401) DBOK=false }
}
/* 주기 동기화 — 다른 거점이 입력한 내용이 자동으로 반영됨 */
async function syncTick(){
  if(SYNCING||!VIEW) return;
  SYNCING=true;
  try{ const before=JSON.stringify(day(VIEW));
       await pullDay(VIEW);
       if(JSON.stringify(day(VIEW))!==before) guard(renderBoard,'거점 현황');
       renderDbTag();
  }finally{ SYNCING=false }
}
function renderDbTag(){
  const el=document.getElementById('dbTag'); if(!el) return;
  if(DBPERM.length){
    el.textContent='● 저장소 권한 오류 (보안규칙 확인)';
    el.style.color='#ffd27f'; el.style.cursor='pointer';
    el.onclick=()=>alert(permHelp());
    return;
  }
  el.onclick=null; el.style.cursor='';
  el.textContent = DBOK===true ? '● 공용 저장소 연결됨'
                 : DBOK===false ? '● 공용 저장소 끊김 (이 브라우저에만 저장)' : '';
  el.style.color = DBOK===true ? '#7fd6a4' : '#f0b7ae';
}
function today(){ return iso(kstNow()) }

/* 현재 실황을 그날 표에 반영 */
function applyLive(d){
  SITES.forEach(s=>{ d.wx[s.id] = LIVE.sites[s.id] ? {...LIVE.sites[s.id]} : null });
}

async function ensureToday(){
  const d=day(today());
  applyLive(d);
  if(!d.baseAt) d.baseAt=stampNow();
  save();
}
/* 표 헤더에 쓰는 기준시각 문자열 */
function stampNow(){
  const n=kstNow();
  return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())} ${pad(n.getHours())}:${pad(n.getMinutes())}`;
}
function headText(dstr, baseAt){
  const dt=new Date(dstr+'T00:00:00');
  const hm=(baseAt||'').split(' ')[1];
  const tail = hm ? `${+hm.split(':')[0]}시 ${hm.split(':')[1]}분 기준` : '기준';
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]}) ${tail}`;
}
/* 오늘 표의 기상값과 기준시각을 현재 시점으로 갱신하고 전 거점에 공유 */
function stampToday(){
  const t=today(), d=day(t);
  applyLive(d);
  d.baseAt=stampNow();
  save(); pushWx(t, d);
  return d;
}
function save(){ S.s(K.db,DB); S.s(K.log,LOG) }

/* ════════════════════════════════════════════════════════════
   8. 인라인 입력 — 칸을 누르면 그 자리에서 바로 고친다
   ════════════════════════════════════════════════════════════ */
const ROW_LB={worker:'근로자', facility:'제품(시설)', transport:'운송', etc:'기타사항'};
let EDITING=null;                                  // '거점id:항목'

function beginEdit(siteId, key, el){
  if(!canEdit()) return;
  const tag=siteId+':'+key;
  if(EDITING===tag) return;
  EDITING=tag;
  const d=day(VIEW);
  const cur = key==='etc' ? (d.etc.text||'') : (d.notes[siteId]?.[key]||'');
  const multi = key==='etc';
  el.classList.add('editing');
  el.innerHTML = (key==='etc' ? '' : `<div class="in-lb">${ROW_LB[key]}</div>`)
    + `<textarea class="in-ed${multi?' tall':''}" spellcheck="false"></textarea>`
    + `<div class="in-tip">Enter 저장 · Shift+Enter 줄바꿈 · Esc 취소</div>`;
  const ta=el.querySelector('textarea');
  ta.value=cur;
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  let done=false;
  const finish=(save)=>{
    if(done) return; done=true; EDITING=null;
    if(save) commitEdit(siteId,key,ta.value);
    else guard(renderBoard,'거점 현황');
  };
  ta.onblur=()=>finish(true);
  ta.onkeydown=(e)=>{
    if(e.key==='Escape'){ e.preventDefault(); finish(false) }
    else if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); finish(true) }
  };
}
/* ── 일괄 입력 / 일괄 삭제 ─────────────────────────────────
   30개 칸을 하나씩 누르는 수고를 덜기 위한 기능.
   기타사항은 성격이 달라 '전체입력' 대상에서 빼고, '전체삭제' 에만 포함한다. */
const NO_ISSUE='특이사항 없음';

async function bulkApply(value, label){
  if(!canEdit()){ alert('사용자 코드를 먼저 입력하세요.'); return }
  flushEdit();
  const d=day(VIEW), stamp=nowStamp();
  const filled=SITES.filter(s=>{
    const n=d.notes[s.id]||{}; return n.worker||n.facility||n.transport;
  }).length;
  let msg = value===null
    ? `전 거점의 입력 내용을 지웁니다.\n기타사항도 함께 지워집니다.\n\n계속할까요?`
    : `전 거점의 근로자 · 제품(시설) · 운송 칸을\n"${value}" 으로 채웁니다.\n\n계속할까요?`;
  if(filled) msg = `이미 입력된 거점이 ${filled}개소 있습니다. 덮어씁니다.\n\n`+msg;
  if(!confirm(msg)) return;

  const v = value===null ? '' : value;
  SITES.forEach(s=>{ d.notes[s.id]={worker:v, facility:v, transport:v, by:WHO, at:stamp} });
  if(value===null) d.etc={text:'', by:WHO, at:stamp};
  save();
  guard(renderBoard,'거점 현황');

  try{
    await fbSend(`/days/${VIEW}/notes`, d.notes, 'PUT');
    if(value===null) await fbSend(`/days/${VIEW}/etc`, d.etc, 'PUT');
    DBOK=true;
  }catch(e){
    if(e.status!==401) DBOK=false;
    alert(e.status===401 ? permHelp() : '공용 저장소 반영 실패: '+e.message);
  }
  addLog(label, WHO, '전 거점', '일괄', '', value===null?'(삭제)':value);
  renderDbTag();
}
function bulkFill(){  return bulkApply(NO_ISSUE, '일괄입력') }
function bulkClear(){ return bulkApply(null,     '일괄삭제') }

/* 열려 있는 입력창의 값을 즉시 반영 (확정 직전에 호출) */
function flushEdit(){
  const ta=document.querySelector('.in-ed');
  if(!ta || !EDITING) return;
  const [siteId,key]=EDITING.split(':');
  EDITING=null;
  ta.onblur=null;
  commitEdit(siteId,key,ta.value);
}
function commitEdit(siteId, key, raw){
  const v=String(raw).trim();
  const d=day(VIEW), stamp=nowStamp();
  if(key==='etc'){
    if(v===(d.etc.text||'')){ guard(renderBoard,'거점 현황'); return }
    addLog('입력',WHO,'기타사항','기타사항',d.etc.text,v);
    d.etc={text:v, by:WHO, at:stamp};
    pushEtc(VIEW, d.etc).then(renderDbTag);
  }else{
    const n=d.notes[siteId];
    if(v===(n[key]||'')){ guard(renderBoard,'거점 현황'); return }
    addLog('입력',WHO,siteName(siteId),ROW_LB[key],n[key],v);
    n[key]=v; n.by=WHO; n.at=stamp;
    pushNote(VIEW, siteId, {[key]:v, by:WHO, at:stamp}).then(renderDbTag);
  }
  save();
  guard(renderBoard,'거점 현황');
}

/* ════════════════════════════════════════════════════════════
   8-4. 폭염현황 확정 (시점별 누적 저장)
   ════════════════════════════════════════════════════════════ */
let HIST=[];

/* 확정 스냅샷 만들기
   dstr 를 주면 그 일자의 저장자료로 만든다 (자정 자동저장용).
   비우면 오늘 화면 상태(실시간 기상 + 현재 입력값)로 만든다. */
function buildSnapshot(by, dstr){
  const target = dstr || VIEW;
  const d = day(target);
  const now = kstNow();
  const live = !dstr;                                  // 오늘이면 실시간 기상값 사용
  return {
    savedAt: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    savedBy: by,
    date: target,
    baseAt: d.baseAt||'',
    sites: SITES.map(s=>{
      const w = live ? (LIVE.sites[s.id]||{}) : (d.wx[s.id]||{});
      const n = d.notes[s.id]||{};
      return { id:s.id, name:s.name,
               sky:(w.sky??1), pty:(w.pty??0),
               ta:(w.ta??''), feels:(w.feels??''), alert:(w.alert||'없음'),
               worker:n.worker||'', facility:n.facility||'', transport:n.transport||'' };
    }),
    etc: d.etc.text||''
  };
}

/* 지정 일자의 입력란 비우기 (자정 자동저장에서만 사용) */
async function clearInputs(dstr){
  const target=dstr||VIEW;
  const d=day(target), stamp=nowStamp();
  SITES.forEach(s=>{ d.notes[s.id]={worker:'',facility:'',transport:'',by:'',at:stamp} });
  d.etc={text:'',by:'',at:stamp};
  save();
  try{
    await fbSend(`/days/${target}/notes`, d.notes, 'PUT');
    await fbSend(`/days/${target}/etc`,   d.etc,   'PUT');
    DBOK=true;
  }catch(e){ if(e.status!==401) DBOK=false }
}

/* ── 매일 00:00 자동저장 ─────────────────────────────────────
   자정이 지나면 '전일자' 자료를 확정 스냅샷으로 남기고 그 일자의 입력란을 비운다.
   오늘 입력 중인 값은 절대 건드리지 않는다.
   자정에 아무도 화면을 켜두지 않았어도, 다음 접속 때 전일자를 처리한다. */
function prevDate(dstr){
  const d=new Date(dstr+'T00:00:00'); d.setDate(d.getDate()-1); return iso(d);
}
let AUTO_TRIED={};                                   // 이번 세션에서 확인한 일자
async function autoSaveDay(dstr){
  if(AUTO_TRIED[dstr]) return false;
  // ① 이미 처리된 일자인지 먼저 확인 (가장 싼 검사)
  try{
    const flag=await fbGet(`/autofix/${dstr}`);
    if(flag){ AUTO_TRIED[dstr]=1; return false }
  }catch(e){
    if(e.status===401){ AUTO_TRIED[dstr]=1; return false }
    const seen=S.g('heatAutoFix',{});
    if(seen[dstr]){ AUTO_TRIED[dstr]=1; return false }
  }
  // ② 그 일자의 실제 내용을 공용 저장소에서 가져온다.
  //    (목록만 받아온 상태에서는 내용이 비어 있어 그냥 넘어가 버린다)
  await pullDay(dstr);
  const d=DB[dstr];
  const hasAny = d && ( SITES.some(x=>{
        const n=d.notes?.[x.id]||{};
        return n.worker||n.facility||n.transport;
      }) || (d.etc && d.etc.text) );
  if(!hasAny){ AUTO_TRIED[dstr]=1; return false }       // 기입된 게 없으면 저장할 것도 없음

  // ③ 표식을 먼저 남겨 다른 PC와 중복 저장되지 않게 한다
  try{ await fbSend(`/autofix/${dstr}`, {at:stampNow(), by:'자동(00시)'}, 'PUT') }
  catch(e){ const seen=S.g('heatAutoFix',{}); seen[dstr]=1; S.s('heatAutoFix',seen) }

  const rec=buildSnapshot('자동(00시)', dstr);
  try{ await fbPush('/confirmed', rec) }
  catch(e){ console.warn('자동저장 실패', e.message); AUTO_TRIED[dstr]=1; return false }
  addLog('자동저장','시스템','폭염현황',dstr,'',rec.savedAt);
  await clearInputs(dstr);                              // 자동저장 후에만 초기화
  AUTO_TRIED[dstr]=1;
  return true;
}

/* 매일 한국시간 00:00 기준 자동저장.
   자정에 화면이 안 켜져 있었어도, 다음 접속 때 밀린 날짜를 찾아 처리한다.
   오늘 입력 중인 값은 대상이 아니다. */
async function autoSaveMidnight(){
  const t=today();
  let done=false;
  for(let i=1;i<=7;i++){                                // 최근 7일 중 미저장분
    const d=new Date(t+'T00:00:00'); d.setDate(d.getDate()-i);
    if(await autoSaveDay(iso(d))) done=true;
  }
  if(done){ await loadHist(); guard(renderTop,'상단') }
  return done;
}

async function confirmBoard(){
  if(!canEdit()){ alert('사용자 코드를 먼저 입력하세요.'); return }
  flushEdit();                                 // 입력창이 열려 있으면 먼저 저장
  const d=day(VIEW);
  const empty=SITES.filter(s=>{
    const n=d.notes[s.id]||{};
    return !n.worker && !n.facility && !n.transport;
  });
  let msg=`${VIEW} 폭염현황을 확정 저장할까요?\n확정본은 지워지지 않고 이력에 쌓입니다.`;
  if(empty.length) msg=`아직 입력되지 않은 거점이 ${empty.length}개소 있습니다.\n(${empty.map(s=>s.name).join(', ')})\n\n`+msg;
  if(!confirm(msg)) return;

  const btn=document.getElementById('btnFix'); btn.disabled=true;
  const rec=buildSnapshot(WHO);
  try{
    await fbPush('/confirmed', rec);
    addLog('확정',WHO,'폭염현황',VIEW,'',rec.savedAt);
    document.getElementById('fixTime').textContent='최근 확정 '+rec.savedAt+' · '+rec.savedBy;
    flash('btnFix','✓ 확정 저장됨',2200);       // 입력값은 그대로 유지한다
    await loadHist();
  }catch(e){ alert(e.status===401 ? permHelp() : '확정 저장 실패: '+e.message) }
  finally{ btn.disabled=false; renderDbTag() }
}

let HIST_OPEN=false;
function toggleHist(){
  HIST_OPEN=!HIST_OPEN;
  document.getElementById('histWrap').style.display=HIST_OPEN?'block':'none';
  document.getElementById('histAr').className='acc-ar'+(HIST_OPEN?' on':'');
  if(HIST_OPEN) renderHist();
}

async function loadHist(){
  try{
    const o=await fbGet('/confirmed'); DBOK=true;
    HIST=Object.entries(o||{}).map(([id,v])=>({id,...v}))
          .sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));
  }catch(e){ if(e.status!==401) DBOK=false; HIST=[] }
  renderHist(); renderDbTag();
  const last=HIST[0];
  if(last) document.getElementById('fixTime').textContent='최근 확정 '+last.savedAt+' · '+(last.savedBy||'');
}
function renderHist(){
  document.getElementById('histCnt').textContent = HIST.length?`${HIST.length}건`:'';
  const box=document.getElementById('histList');
  if(!HIST.length){ box.innerHTML='<div class="hist-none">확정된 기록이 없습니다.</div>'; return }
  const ed=canEdit();                                  // 코드 입력 상태에서만 삭제 허용
  box.innerHTML='<table><thead><tr><th style="width:22%">확정 시점</th><th style="width:14%">확정자</th>'
    +'<th style="width:13%">대상 일자</th><th>폭염특보 요약</th>'
    +`<th style="width:${ed?15:9}%"></th></tr></thead><tbody>`
    + HIST.slice(0,60).map(h=>{
        const on=(h.sites||[]).filter(x=>x.alert&&x.alert!=='없음');
        const sum = on.length ? on.map(x=>`${x.name} ${x.alert}`).join(', ') : '발효 없음';
        return `<tr><td><b>${esc(h.savedAt||'')}</b></td><td>${esc(h.savedBy||'')}</td>
          <td>${esc(h.date||'')}</td><td class="sm">${esc(sum)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button onclick="viewHist('${h.id}')">보기</button>
            ${ed?`<button class="del" onclick="deleteHist('${h.id}')">삭제</button>`:''}
          </td></tr>`;
      }).join('') + '</tbody></table>'
    + (ed?'':'<div class="hist-note">삭제하려면 상단에 사용자 코드를 입력하세요.</div>');
}

/* 확정 기록 삭제 — 코드 입력(admin) 상태에서만 */
async function deleteHist(id){
  if(!canEdit()){ alert('사용자 코드를 먼저 입력하세요.'); return }
  const h=HIST.find(x=>x.id===id); if(!h) return;
  if(!confirm(`아래 확정 기록을 삭제할까요?\n\n확정 시점 : ${h.savedAt}\n확정자 : ${h.savedBy}\n대상 일자 : ${h.date}\n\n삭제하면 되돌릴 수 없습니다.`)) return;
  try{
    const r=await fetch(`${FB}/confirmed/${id}.json`,{method:'DELETE'});
    if(!r.ok) throw dbErr(r.status,'/confirmed');
    addLog('확정삭제',WHO,'폭염현황',h.date||'',h.savedAt||'','');
    await loadHist();
    if(!HIST.length) document.getElementById('fixTime').textContent='';
    else { const last=HIST[0];
           document.getElementById('fixTime').textContent='최근 확정 '+last.savedAt+' · '+(last.savedBy||'') }
  }catch(e){ alert(e.status===401 ? permHelp() : '삭제 실패: '+e.message) }
  renderDbTag();
}

       <thead><tr><th>거점</th><th>기상</th><th>기온</th><th>체감</th><th>폭염특보</th>
         <th>근로자</th><th>제품(시설)</th><th>운송</th></tr></thead>

/* ── 공통 유틸 ────────────────────────────────────────────── */
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function nowStamp(){const d=kstNow();
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}

/* ── 변경 이력은 공용 저장소에만 남긴다 (화면 표시 없음) ── */
function addLog(action,user,site,target,before,after){
  const e={ts:new Date().toISOString(),date:VIEW||today(),action,user,site,target,
           before:before||'',after:after||''};
  pushLog(e);
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ════════════════════════════════════════════════════════════
   10. 캡쳐 / 엑셀
   ════════════════════════════════════════════════════════════ */
function shot(){                       // 폭염현황 + 거점별 현재 기상 → canvas
  return html2canvas(document.getElementById('capture'),{
    scale:2, backgroundColor:'#eef1f6',
    ignoreElements: el => el.classList && el.classList.contains('no-copy')   // 버튼은 이미지에서 제외
  });
}
function flash(id,txt,ms){             // 버튼 피드백
  const b=document.getElementById(id), o=b.textContent;
  b.textContent=txt; b.classList.add('done'); b.disabled=true;
  setTimeout(()=>{b.textContent=o;b.classList.remove('done');b.disabled=false},ms||1600);
}


/* 복사 — 클립보드에 이미지로 담아 메일·메신저·한글·워드에 바로 붙여넣기
   버튼 글자는 건드리지 않는다. 복사 → ✓ 복사됨 → 복사 로만 바뀐다. */
const COPY_LABEL='📋 복사';
async function copyImg(){
  const b=document.getElementById('btnCopy');
  if(b.disabled) return;                        // 연타 방지
  b.disabled=true;
  try{
    const cv=await shot();
    // 1순위 : Clipboard API (이미지 그대로 복사)
    try{
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      b.disabled=false; flash('btnCopy','✓ 복사됨',1800); return;
    }catch(e){ /* 미지원 브라우저 → 2순위로 */ }

    // 2순위 : 선택영역 복사 (HTML 이미지로 붙여넣기 — 한글/워드/아웃룩 호환)
    const box=document.createElement('div');
    box.contentEditable='true';
    box.style.cssText='position:fixed;left:-99999px;top:0;opacity:0';
    box.innerHTML=`<img src="${cv.toDataURL('image/png')}">`;
    document.body.appendChild(box);
    const rg=document.createRange(); rg.selectNodeContents(box);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    const ok=document.execCommand('copy');
    sel.removeAllRanges(); box.remove();
    b.disabled=false;
    if(ok) flash('btnCopy','✓ 복사됨',1800);
    else alert('이 브라우저에서는 복사가 지원되지 않습니다.');
  }catch(e){
    b.textContent=COPY_LABEL; b.disabled=false;
    alert('복사 실패: '+e.message);
  }
}

/* ════════════════════════════════════════════════════════════
   11. 구동
   ════════════════════════════════════════════════════════════ */
let BUSY=false, TICK=null;
/* 새로고침 — 날씨를 다시 받아오고, 오늘 표의 기준시각·기상값을 현재 시점으로 갱신 */
async function refreshNow(silent){
  if(BUSY) return;
  BUSY=true;
  const btn=document.getElementById('btnRef');
  if(!silent && btn){
    const t0=Date.now();
    const paint=()=>{ btn.textContent='로딩중... '+((Date.now()-t0)/1000).toFixed(1)+'초' };
    paint();
    clearInterval(TICK); TICK=setInterval(paint,100);
    btn.classList.add('loading'); btn.disabled=true;
    document.body.classList.add('busy');
  }
  try{
    await rollover();                       // 날짜가 바뀌었으면 먼저 정리
    await ensureToday();
    const r=await collect();
    stampToday();                           // 기상값 + 기준시각 갱신 후 공유
    guard(renderTop,'상단'); 
    if(VIEW) guard(renderBoard,'거점 현황');
    renderDbTag();                            // 갱신·관측시각 표시는 renderTop 이 담당
    if(r.fail) console.warn(`${r.fail}개 거점 조회 실패`);
  }catch(e){ console.error('새로고침', e) }
  finally{
    BUSY=false;
    clearInterval(TICK); TICK=null;
    if(!silent && btn){ btn.textContent='↻ 새로고침'; btn.classList.remove('loading');
                        btn.disabled=false; document.body.classList.remove('busy') }
  }
}

/* ── 자정 마감 ────────────────────────────────────────────────
   날짜가 바뀌면 전날 표를 그대로 공용 저장소에 남기고(열람 가능),
   오늘자 새 표를 빈 상태로 준비한다. 사용자가 아무것도 안 해도 자동. */
let LASTDAY=null;
async function rollover(){
  const t=today();
  if(LASTDAY===null){ LASTDAY=t; return false }
  if(LASTDAY===t) return false;
  const prev=LASTDAY;
  try{ await pushWx(prev, day(prev)) }catch(e){}      // 전날 최종본 확정 저장
  addLog('자동','시스템','-','일자 마감', prev, t);
  day(t);                                             // 오늘자 빈 표 생성
  LASTDAY=t;
  AUTO_TRIED={};                                      // 날짜가 바뀌었으니 다시 확인
  if(VIEW===prev) VIEW=t;                             // 화면도 오늘로 전환
  save();
  return true;
}

/* ── 예전 화면 붙들림 방지 ────────────────────────────────────
   서버의 version.json 과 이 파일에 박힌 BUILD 를 비교한다.
   다르면 브라우저가 캐시된 옛 index.html 을 쓰고 있다는 뜻이므로
   (세션당 딱 한 번만) 캐시를 무시하고 다시 받는다. */
async function checkBuild(){
  const tag=document.getElementById('buildTag');
  if(tag) tag.textContent='v'+BUILD;
  if(location.protocol==='file:') return;
  try{
    const r=await fetch('/version.json?_t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const j=await r.json();
    if(!j.build || j.build===BUILD) return;
    if(sessionStorage.getItem('heatReloaded')===j.build) return;   // 무한 새로고침 방지
    sessionStorage.setItem('heatReloaded', j.build);
    location.reload();
  }catch(e){}
}

async function start(){
  checkBuild();
  // 화면은 무조건 먼저 띄운다 — 이후 단계에서 오류가 나도 빈 화면이 되지 않게
  document.getElementById('topbar').style.display='flex';
  document.getElementById('app').style.display='block';
  VIEW=today(); LASTDAY=VIEW;
  try{ if(sessionStorage.getItem('heatUnlock')==='1'){ UNLOCKED=true; WHO='관리자';
        document.getElementById('codeIn').style.display='none';
        document.getElementById('codeBtn').style.display='none';
        document.getElementById('codeOff').style.display='';
        document.getElementById('codeState').textContent='입력 가능';
        document.getElementById('codeState').className='code-lb on'; } }catch(e){}

  await pullDates();
  await pullDay(VIEW);
  guard(renderBoard,'거점 현황');
  await refreshNow();
  await loadHist();

  await autoSaveMidnight();                 // 전일자가 미저장이면 지금 처리 (오늘 값은 안 건드림)

  // 30초 주기 감시 — 자정 날짜 전환 + 전일자 자동저장
  setInterval(async()=>{
    if(await rollover()){
      await collect(); stampToday();
      guard(renderTop,'상단');
    }
    await autoSaveMidnight();
  },30000);
  setInterval(syncTick,20000);
  setInterval(()=>refreshNow(true),600000);
}

(function init(){
  DB=S.g(K.db,{});
  if(!DB||typeof DB!=='object') DB={};
  Object.keys(DB).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) delete DB[k]; else normalizeDay(DB[k],k);
  });
  // 어떤 이유로 start() 가 중단되더라도 화면은 보이게 한다
  try{
    document.getElementById('topbar').style.display='flex';
    document.getElementById('app').style.display='block';
  }catch(e){}
  try{ start() }
  catch(e){
    console.error('시작 오류',e);
    const nb=document.getElementById('netBar');
    if(nb){ nb.style.display='flex';
      nb.innerHTML='<div><b>화면을 준비하는 중 문제가 생겼습니다.</b> '+esc(e.message)+
        ' <button onclick="resetLocal()" style="margin-left:6px;padding:4px 11px;background:#b7791f;'+
        'color:#fff;border:none;border-radius:5px;font-weight:700;cursor:pointer">저장자료 초기화</button></div>'; }
  }
})();
</script>
